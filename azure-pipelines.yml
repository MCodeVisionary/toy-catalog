# Build toy-catalog with Poetry, authenticate to JFrog via OIDC (JFrog Platform service
# connection configured with an OIDC provider - no stored tokens), publish to the
# alpha-pypi-virtual repo and push build-info with JFrog CLI.
#
# Two ways to get the OIDC token and resolve Poetry dependencies:
#   Option 1 (commented out below): curl + REST. Fetch the ADO ID token and exchange it at JFrog
#            with curl, then run plain `poetry install` with credentials from env variables.
#   Option 2 (ACTIVE): JFrog CLI everywhere. The JfrogCliV2 task runs `jf eot` for the OIDC exchange,
#            then `jf poetry-config` and `jf poetry install` resolve through alpha-pypi-virtual
#            and record dependencies in build-info.
trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  JFROG_CONNECTION: mpate-solenglatest-platform   # JFrog Platform service connection (OIDC provider soleng-ado-mp)
  PYPI_REPO: alpha-pypi-virtual
  BUILD_NAME: toy-catalog
  BUILD_NUMBER: $(Build.BuildId)
  # Fixed Poetry cache location (Poetry reads POETRY_CACHE_DIR) so downloaded wheels can be recorded as build-info dependencies.
  POETRY_CACHE_DIR: $(Pipeline.Workspace)/.poetry-cache
  # Used by the curl OIDC exchange (Option 1 and the audit-credentials step below)
  JFROG_CONNECTION_ID: bbe7670a-8377-4b52-b55c-638d8c6c1f55
  JFROG_OIDC_PROVIDER: soleng-ado-mp
  JFROG_URL: https://solenglatest.jfrog.io

steps:
  - checkout: self
    fetchDepth: 0

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'

  - bash: python -m pip install --upgrade pip poetry && poetry --version
    displayName: Install Poetry

  # ===========================================================================================
  # OPTION 1 - curl based OIDC (kept for reference, currently disabled)
  # -------------------------------------------------------------------------------------------
  # Notes:
  #  * Requests the Azure DevOps ID token for the JFrog service connection from
  #    System.OidcRequestUri, then exchanges it at JFrog (/access/api/v1/oidc/token,
  #    provider soleng-ado-mp) for a short-lived access token. Nothing is stored.
  #  * Artifactory Basic auth needs the username to match the token subject, so the user part of
  #    the JWT 'sub' claim is used as the Poetry username.
  #  * Plain `poetry install` is used because `jf poetry` writes the source URL without /simple
  #    (see Option 2 for the workaround). Poetry gets credentials from POETRY_HTTP_BASIC_* env vars,
  #    and the source with /simple comes from pyproject.toml.
  #  * To use Option 1: uncomment the two steps below, delete the Option 2 "Poetry install via jf"
  #    step, and uncomment the Option 1 variables above.
  #
  # - bash: |
  #     set -euo pipefail
  #     ID_TOKEN=$(curl -sf -X POST -d "" -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" -H "Content-Type: application/json" \
  #       "$(System.OidcRequestUri)?api-version=7.1&serviceConnectionId=$(JFROG_CONNECTION_ID)" \
  #       | python3 -c 'import sys,json;print(json.load(sys.stdin)["oidcToken"])')
  #     echo "##vso[task.setvariable variable=ADO_ID_TOKEN;issecret=true]$ID_TOKEN"
  #     RESP=$(curl -sf -X POST "$(JFROG_URL)/access/api/v1/oidc/token" -H "Content-Type: application/json" \
  #       -d "{\"grant_type\":\"urn:ietf:params:oauth:grant-type:token-exchange\",\"subject_token_type\":\"urn:ietf:params:oauth:token-type:id_token\",\"subject_token\":\"$ID_TOKEN\",\"provider_name\":\"$(JFROG_OIDC_PROVIDER)\",\"audience\":\"api://AzureADTokenExchange\"}")
  #     TOKEN=$(python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])' <<<"$RESP")
  #     echo "##vso[task.setvariable variable=JFROG_ACCESS_TOKEN;issecret=true]$TOKEN"
  #     # Artifactory basic auth needs the username to match the token subject (user part of 'sub').
  #     TOKEN_USER=$(python3 -c 'import sys,json,base64;t=sys.argv[1].split(".")[1];t+="="*(-len(t)%4);sub=json.loads(base64.urlsafe_b64decode(t))["sub"];print(sub.split("/users/")[-1])' "$TOKEN")
  #     echo "Token subject user: $TOKEN_USER"
  #     echo "##vso[task.setvariable variable=JFROG_TOKEN_USER]$TOKEN_USER"
  #   displayName: "[Option 1] JFrog OIDC token exchange for Poetry (curl)"
  #   env:
  #     SYSTEM_ACCESSTOKEN: $(System.AccessToken)
  #
  # - bash: |
  #     set -euo pipefail
  #     poetry install --no-interaction
  #   displayName: "[Option 1] Poetry install (resolves from $(PYPI_REPO))"
  #   env:
  #     POETRY_HTTP_BASIC_ALPHA_PYPI_VIRTUAL_USERNAME: $(JFROG_TOKEN_USER)
  #     POETRY_HTTP_BASIC_ALPHA_PYPI_VIRTUAL_PASSWORD: $(JFROG_ACCESS_TOKEN)
  # ===========================================================================================

  # ===========================================================================================
  # OPTION 2 - JFrog CLI everywhere (ACTIVE)
  # -------------------------------------------------------------------------------------------
  # Notes:
  #  * The JfrogCliV2 task runs `jf eot` (OIDC token exchange via provider soleng-ado-mp) and
  #    registers a temporary server config; it is removed when the step ends, so every jf command
  #    that needs auth runs inside a JfrogCliV2 step. Multiple commands are allowed per step.
  #  * `jf poetry-config` + `jf poetry install` route resolution through the virtual repo and add
  #    the dependencies to build-info (--build-name/--build-number/--module).
  #  * Workaround: `jf poetry` builds the source URL as <artifactory>/api/pypi/<repo> and Artifactory
  #    only serves the Poetry index under .../simple, so the repo is passed as "<repo>/simple".
  #    Without it resolution fails ("pytest ... doesn't match any versions", HTTP 404).
  #  * jf rewrites the [[tool.poetry.source]] block and poetry.lock in the CI workspace only.
  # ===========================================================================================
  # ===========================================================================================
  # Curation audit + jf audit (run BEFORE jf poetry install, which rewrites the pyproject.toml source)
  # -------------------------------------------------------------------------------------------
  #  * jf audit builds the Poetry dependency tree with plain `poetry`, which needs credentials for the
  #    private alpha-pypi-virtual source. The JfrogCliV2 task drops its server config after each step,
  #    so a short-lived token is obtained once with the same OIDC exchange as Option 1 and handed to
  #    the audit steps as POETRY_HTTP_BASIC_* env vars (masked, never stored).
  # ===========================================================================================
  - bash: |
      set -euo pipefail
      ID_TOKEN=$(curl -sf -X POST -d "" -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" -H "Content-Type: application/json" \
        "$(System.OidcRequestUri)?api-version=7.1&serviceConnectionId=$(JFROG_CONNECTION_ID)" \
        | python3 -c 'import sys,json;print(json.load(sys.stdin)["oidcToken"])')
      echo "##vso[task.setvariable variable=ADO_ID_TOKEN;issecret=true]$ID_TOKEN"
      RESP=$(curl -sf -X POST "$(JFROG_URL)/access/api/v1/oidc/token" -H "Content-Type: application/json" \
        -d "{\"grant_type\":\"urn:ietf:params:oauth:grant-type:token-exchange\",\"subject_token_type\":\"urn:ietf:params:oauth:token-type:id_token\",\"subject_token\":\"$ID_TOKEN\",\"provider_name\":\"$(JFROG_OIDC_PROVIDER)\",\"audience\":\"api://AzureADTokenExchange\"}")
      TOKEN=$(python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])' <<<"$RESP")
      echo "##vso[task.setvariable variable=JFROG_ACCESS_TOKEN;issecret=true]$TOKEN"
      TOKEN_USER=$(python3 -c 'import sys,json,base64;t=sys.argv[1].split(".")[1];t+="="*(-len(t)%4);sub=json.loads(base64.urlsafe_b64decode(t))["sub"];print(sub.split("/users/")[-1])' "$TOKEN")
      echo "##vso[task.setvariable variable=JFROG_TOKEN_USER]$TOKEN_USER"
    displayName: OIDC token for Poetry-based audits (curl)
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - task: JfrogCliV2@1
    displayName: Curation audit
    inputs:
      jfrogPlatformConnection: $(JFROG_CONNECTION)
      command: jf curation-audit --format=table
    env:
      POETRY_HTTP_BASIC_ALPHA_PYPI_VIRTUAL_USERNAME: $(JFROG_TOKEN_USER)
      POETRY_HTTP_BASIC_ALPHA_PYPI_VIRTUAL_PASSWORD: $(JFROG_ACCESS_TOKEN)

  # --sca runs SCA *and* Contextual Analysis (is the vulnerable code actually reachable/applicable);
  # secrets, IaC and SAST are added explicitly. (jf build-scan at the end only fetches Xray's verdict on
  # the published build and has no contextual analysis option, so it is covered here.)
  # --fail=false keeps the pipeline green; add --watches=<watch> --fail=true to gate on policy.
  - task: JfrogCliV2@1
    displayName: jf audit (SCA + Contextual Analysis + Advanced Security)
    inputs:
      jfrogPlatformConnection: $(JFROG_CONNECTION)
      command: jf audit --sca --secrets --iac --sast --vuln --licenses --fail=false
    env:
      POETRY_HTTP_BASIC_ALPHA_PYPI_VIRTUAL_USERNAME: $(JFROG_TOKEN_USER)
      POETRY_HTTP_BASIC_ALPHA_PYPI_VIRTUAL_PASSWORD: $(JFROG_ACCESS_TOKEN)

  - task: JfrogCliV2@1
    displayName: "[Option 2] jf OIDC login, poetry-config and poetry install"
    inputs:
      jfrogPlatformConnection: $(JFROG_CONNECTION)
      command: |
        jf poetry-config --repo-resolve=$(PYPI_REPO)/simple
        jf poetry install --no-interaction --build-name=$(BUILD_NAME) --build-number=$(BUILD_NUMBER) --module=toy-catalog

  - bash: |
      set -euo pipefail
      poetry run pytest -q
      poetry build
      ls -l dist
    displayName: Test and poetry build

  - task: JfrogCliV2@1
    displayName: Publish to $(PYPI_REPO)
    inputs:
      jfrogPlatformConnection: $(JFROG_CONNECTION)
      command: jf rt upload "dist/*" $(PYPI_REPO)/ --module=toy-catalog --build-name=$(BUILD_NAME) --build-number=$(BUILD_NUMBER)

  # `jf poetry install` does not collect dependencies into build-info (it only handles resolution),
  # so the wheels Poetry downloaded into its cache are attached as build dependencies with their
  # checksums; Artifactory links them to the cached files in alpha-pypi-remote-cache.
  - task: JfrogCliV2@1
    displayName: Add Poetry dependencies to build-info
    inputs:
      jfrogPlatformConnection: $(JFROG_CONNECTION)
      command: jf rt build-add-dependencies $(BUILD_NAME) $(BUILD_NUMBER) "$(POETRY_CACHE_DIR)/artifacts/*/*/*/*/*.whl" --module=toy-catalog

  - task: JfrogCliV2@1
    displayName: Collect build-info and publish
    inputs:
      jfrogPlatformConnection: $(JFROG_CONNECTION)
      command: |
        jf rt build-collect-env $(BUILD_NAME) $(BUILD_NUMBER)
        jf rt build-add-git $(BUILD_NAME) $(BUILD_NUMBER)
        jf rt build-publish $(BUILD_NAME) $(BUILD_NUMBER)

  # Xray build scan of the published build-info (needs Xray on the platform and indexed build).
  # --vuln lists vulnerabilities even without a watch/policy; --fail=false keeps the pipeline green.
  # Set --fail=true together with --watches=<watch> (or --project/--repo-path) to gate the build.
  - task: JfrogCliV2@1
    displayName: Xray build scan
    inputs:
      jfrogPlatformConnection: $(JFROG_CONNECTION)
      command: jf build-scan $(BUILD_NAME) $(BUILD_NUMBER) --vuln --fail=false
