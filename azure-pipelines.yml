# Build toy-catalog with Poetry, authenticate to JFrog via OIDC (JFrog Platform service
# connection configured with an OIDC provider - no stored tokens), publish to the
# alpha-pypi-virtual repo and push build-info with JFrog CLI.
trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  JFROG_CONNECTION: mpate-solenglatest-platform   # JFrog Platform service connection (OIDC provider soleng-ado-mp)
  PYPI_REPO: alpha-pypi-virtual
  BUILD_NAME: toy-catalog
  BUILD_NUMBER: $(Build.BuildId)

steps:
  - checkout: self
    fetchDepth: 0

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'

  # Installs JFrog CLI, exchanges the Azure DevOps OIDC token for a short-lived JFrog token
  # and registers the server config on the agent for the following steps.
  - task: JfrogCliV2@1
    displayName: JFrog OIDC login
    inputs:
      jfrogPlatformConnection: $(JFROG_CONNECTION)
      command: jf rt ping
      registerInPath: true

  - bash: |
      set -euo pipefail
      python -m pip install --upgrade pip poetry
      # Short-lived OIDC-issued token (masked) so Poetry can resolve through the virtual repo.
      TOKEN=$(jf config export | base64 -d | python3 -c 'import sys,json;print(json.load(sys.stdin)["accessToken"])')
      echo "##vso[task.setvariable variable=JFROG_ACCESS_TOKEN;issecret=true]$TOKEN"
    displayName: Install Poetry and prepare resolver credentials

  - bash: |
      set -euo pipefail
      poetry install --no-interaction
      poetry run pytest -q
    displayName: Poetry install (via alpha-pypi-virtual) and test
    env:
      POETRY_HTTP_BASIC_ALPHA_PYPI_VIRTUAL_USERNAME: oidc
      POETRY_HTTP_BASIC_ALPHA_PYPI_VIRTUAL_PASSWORD: $(JFROG_ACCESS_TOKEN)

  - bash: |
      set -euo pipefail
      poetry build
      ls -l dist
    displayName: Poetry build

  - bash: |
      set -euo pipefail
      jf rt upload "dist/*" "$(PYPI_REPO)/" --module=toy-catalog \
        --build-name="$(BUILD_NAME)" --build-number="$(BUILD_NUMBER)"
    displayName: Publish to $(PYPI_REPO)

  - bash: |
      set -euo pipefail
      jf rt build-collect-env "$(BUILD_NAME)" "$(BUILD_NUMBER)"
      jf rt build-add-git     "$(BUILD_NAME)" "$(BUILD_NUMBER)"
      jf rt build-publish     "$(BUILD_NAME)" "$(BUILD_NUMBER)"
    displayName: Collect and publish build-info
