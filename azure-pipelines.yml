# Build toy-catalog with Poetry, authenticate to JFrog via OIDC (JFrog Platform service
# connection configured with an OIDC provider - no stored tokens), publish to the
# alpha-pypi-virtual repo and push build-info with JFrog CLI.
trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  JFROG_CONNECTION: mpate-solenglatest-platform   # JFrog Platform service connection (OIDC provider soleng-ado-mp)
  PYPI_REPO: alpha-pypi-virtual
  BUILD_NAME: toy-catalog
  BUILD_NUMBER: $(Build.BuildId)

steps:
  - checkout: self
    fetchDepth: 0

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'

  - bash: python -m pip install --upgrade pip poetry && poetry --version
    displayName: Install Poetry

  # Each JfrogCliV2 step exchanges the Azure DevOps OIDC token for a short-lived JFrog token.
  - task: JfrogCliV2@1
    displayName: Configure Poetry resolution from $(PYPI_REPO)
    inputs:
      jfrogPlatformConnection: $(JFROG_CONNECTION)
      command: poetry-config --repo-resolve=$(PYPI_REPO)

  - task: JfrogCliV2@1
    displayName: Poetry install via JFrog (collects dependencies for build-info)
    inputs:
      jfrogPlatformConnection: $(JFROG_CONNECTION)
      command: poetry install --no-interaction --build-name=$(BUILD_NAME) --build-number=$(BUILD_NUMBER) --module=toy-catalog

  - bash: |
      set -euo pipefail
      poetry run pytest -q
      poetry build
      ls -l dist
    displayName: Test and poetry build

  - task: JfrogCliV2@1
    displayName: Publish to $(PYPI_REPO)
    inputs:
      jfrogPlatformConnection: $(JFROG_CONNECTION)
      command: rt upload "dist/*" $(PYPI_REPO)/ --module=toy-catalog --build-name=$(BUILD_NAME) --build-number=$(BUILD_NUMBER)

  - task: JfrogCliV2@1
    displayName: Collect environment variables
    inputs:
      jfrogPlatformConnection: $(JFROG_CONNECTION)
      command: rt build-collect-env $(BUILD_NAME) $(BUILD_NUMBER)

  - task: JfrogCliV2@1
    displayName: Collect git info
    inputs:
      jfrogPlatformConnection: $(JFROG_CONNECTION)
      command: rt build-add-git $(BUILD_NAME) $(BUILD_NUMBER)

  - task: JfrogCliV2@1
    displayName: Publish build-info
    inputs:
      jfrogPlatformConnection: $(JFROG_CONNECTION)
      command: rt build-publish $(BUILD_NAME) $(BUILD_NUMBER)
