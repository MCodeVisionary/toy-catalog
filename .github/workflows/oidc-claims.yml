# Debug helper: prints the claims in the GitHub OIDC token for this repo so JFrog identity
# mappings can be written against the real values. Prints the decoded payload only (never the token).
name: oidc-claims

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Show OIDC token claims
        run: |
          TOKEN=$(curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$TOKEN"
          python3 - "$TOKEN" <<'PY'
          import sys, json, base64
          part = sys.argv[1].split(".")[1]
          part += "=" * (-len(part) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(part)), indent=2, sort_keys=True))
          PY
