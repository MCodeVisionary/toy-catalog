# JFrog Frogbot v3: Xray-based security scanning.
#   * Pull requests            -> scan-pull-request (comments on the PR with new vulnerabilities)
#   * push to main / daily / manual -> scan-repository (all issues, plus fix PRs for vulnerable dependencies)
# v3 uses a static SCA engine: no package manager or build is needed, so no Poetry install or
# credentials are required (v2 needed both). Results are uploaded as SBOMs to the JFrog Platform.
# Authenticates with JFrog OIDC (provider github-docportal, mapping "toy-catalog"): no stored tokens.
#
# Scanners (SCA, Contextual Analysis, IaC, Secrets, SAST) are enabled on the platform, not here:
#   Administration -> Xray Settings -> Indexed Resources -> Git Repositories -> Frogbot Configuration.
# Platform prerequisites: Xray 3.143.6+, a Generic local repo named "frogbot" (Deploy granted), and a token
# user with Xray Admin + Catalog Admin (Frogbot 3.7+ / Xray 3.155+).
#
# The repo is PUBLIC and pull_request_target runs with a privileged token, so the job uses the
# "frogbot" environment: add required reviewers to it (Settings -> Environments -> frogbot).
name: "Frogbot Security Scan"

on:
  pull_request_target:
    types: [opened, synchronize]
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write        # fix PR branches (scan-repository)
  pull-requests: write   # PR comments / fix PRs
  security-events: write # upload code scanning results
  id-token: write        # OIDC token for JFrog
  actions: read

jobs:
  frogbot-scan:
    runs-on: ubuntu-latest
    environment: frogbot
    steps:
      - uses: jfrog/frogbot@v3
        env:
          # Hardcoded: an org-level JF_URL variable points at soleng.jfrog.io.
          JF_URL: https://solenglatest.jfrog.io
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_GIT_BASE_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          oidc-provider-name: github-docportal
